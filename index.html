<html lang="en" data-theme="dark">
  <head>

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <link rel="android-chrome-192x192" href="/android-chrome-192x192.png" />
    <link rel="android-chrome-512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Bunk Mate - Smart attendance tracking for college students. Track attendance, calculate safe bunks, and avoid debarment."
    />
    <meta
      name="keywords"
      content="attendance tracker, college app, student app, bunk calculator, attendance management, bunk mate, bunkmate, BunkMate, Bunkmate, attendance monitoring, college attendance, smart bunking, attendance alert"
    />

    <meta property="og:title" content="Bunk Mate" />
    <meta
      property="og:description"
      content="Bunk Mate - Bunk Smarter, Not Harder"
    />
    <meta property="og:image" content="/vite.svg" />
    <meta property="og:url" content="https://bunkmate.kichu.dpdns.org" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bunk Mate" />
    <meta
      name="twitter:description"
      content="Bunk Mate - Bunk Smarter, Not Harder"
    />
    <meta name="twitter:image" content="/favicon-32x32.png" />
    <link rel="canonical" href="https://bunkmate.kichu.dpdns.org" />

    <meta name="twitter:site" content="@bunkmate" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Anton&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("bunkmate-theme");
          const theme = JSON.parse(stored)?.state?.theme;

          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
